name: Refresh amnesty site

on:
  workflow_dispatch:
    inputs:
      full:
        description: 强制全量重抓（约 70 分钟；平时都是增量）
        type: boolean
        default: false
  schedule:
    # 增量：每 2 小时，翻到上次水位就停
    - cron: "23 */2 * * *"
    # 全量对账：每周日 03:17 UTC，补增量扫不到的角落（见 README）
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: refresh-amnesty-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # 规范名优先，旧名兜底，便于 Secret 迁移期两个名字都能用。
      BILI_AGENT_BILI_SESSDATA: ${{ secrets.BILI_AGENT_BILI_SESSDATA || secrets.BILI_SESSDATA }}
      BILI_AGENT_BILI_JCT: ${{ secrets.BILI_AGENT_BILI_JCT || secrets.BILI_JCT }}
      BILI_AGENT_BILI_USER_ID: ${{ secrets.BILI_AGENT_BILI_USER_ID || secrets.BILI_USER_ID }}
      # 可选：Jev 批量判灰区（System One）；没配会自动退回纯规则（灰区全部放行）
      TYPESAFE_API_KEYS: ${{ secrets.TYPESAFE_API_KEYS || secrets.TYPESAFE_API_KEY }}
      # 可选：OpenAI 兼容模型兜底
      BILI_AGENT_LLM_API_KEY: ${{ secrets.BILI_AGENT_LLM_API_KEY || secrets.BILI_AGENT_API_KEY }}
      BILI_AGENT_BASE_URL: ${{ secrets.BILI_AGENT_BASE_URL }}
      BILI_AGENT_CHAT_MODEL: ${{ secrets.BILI_AGENT_CHAT_MODEL }}
      # 可选：发布到 Cloudflare Pages；没配就只提交产物，不部署
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装抓取依赖
        run: python -m pip install "requests>=2.28" "openai>=1.0" "pypinyin>=0.50"
      - name: 决定本轮口径
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "17 3 * * 0" ] || [ "${{ inputs.full }}" = "true" ]; then
            echo "flag=--full" >> "$GITHUB_OUTPUT"
            echo "本轮：全量对账"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "本轮：增量"
          fi
      - name: 抓评论与私信、合并名册、重新打包
        id: refresh
        continue-on-error: true
        run: python amnesty-site/refresh.py --fetch --judge jev ${{ steps.mode.outputs.flag }}
      - name: 提交数据与构建产物
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 首次运行前 crawl-state.json 还不存在，逐个判断，避免 pathspec 报错
          for name in data.json status.json crawl-state.json avatars.json dist; do
            if [ -e "amnesty-site/site/$name" ]; then
              git add "amnesty-site/site/$name"
            fi
          done
          if git diff --cached --quiet; then
            echo "数据没有变化，跳过提交。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh amnesty roster data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: 发布到 Cloudflare Pages
        # 直传 dist 而不走 Cloudflare 的 Git 构建：仓库路径含中文，交给 CF 构建环境
        # 解析容易出问题；直传也省掉它拉代码装依赖的时间。
        if: steps.refresh.outcome == 'success'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "未配置 Cloudflare 密钥，跳过发布（站点仍可用上一次的部署）。"
            exit 0
          fi
          # 全局安装而不是 npx：npx 在部分环境下不透传环境变量，token 会被忽略
          npm i -g wrangler@4 >/dev/null
          wrangler pages project create whalegirl --production-branch=main 2>/dev/null || true
          wrangler pages deploy "amnesty-site/site/dist" \
            --project-name=whalegirl \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-message="Refresh amnesty roster data"
      - name: 失败时让任务标红
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::本次抓取失败，站点仍使用上一次成功的数据。请看 status.json 的 lastError。"
          exit 1
