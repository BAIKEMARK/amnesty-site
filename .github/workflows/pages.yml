name: Deploy site to Pages

# 旧地址 http://blog.051088.xyz/amnesty-list/ 以前是从仓库根目录发旧版 index.html，
# 现在改成直接发布 dist（数据外置版），保证这个地址一直是新站点。
on:
  push:
    branches: [main]
    paths:
      - "amnesty-site/赦免网站/dist/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: amnesty-site/赦免网站/dist
      - id: deployment
        uses: actions/deploy-pages@v4
