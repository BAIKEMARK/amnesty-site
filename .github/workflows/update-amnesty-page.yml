name: Update amnesty list page

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-amnesty-page
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BILI_AGENT_BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
      BILI_AGENT_BILI_JCT: ${{ secrets.BILI_JCT }}
      BILI_AGENT_BILI_USER_ID: ${{ secrets.BILI_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Bilibili client dependency
        run: python -m pip install "requests>=2.28"
      - name: Fetch visible comments and rebuild the page
        id: fetch
        continue-on-error: true
        run: python generate_amnesty_list.py --fetch --output amnesty-site/index.html
      - name: Keep the previous page when a refresh fails
        if: steps.fetch.outcome == 'failure'
        run: echo "Refresh failed; publishing the last successful page instead."
      - name: Commit the page when its contents changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amnesty-site/index.html
          if git diff --cached --quiet; then
            echo "The generated page has no changes."
          else
            git commit -m "Refresh amnesty list page"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: amnesty-site

  deploy:
    runs-on: ubuntu-latest
    needs: refresh
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the generated site
        id: deployment
        uses: actions/deploy-pages@v4
